<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Trees Visualization</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
</head>
<body>
    <div id="controls">
        <button id="startBtn">Start Growing</button>
        <button id="pauseBtn">Pause (P)</button>
        <button id="debugBtn">Toggle Debug (D)</button>
        <div id="stats">FPS: <span id="fpsCounter">0</span></div>
    </div>
    
    <div class="key-hint">
        <p>Press 'P' to pause/resume<br>Press 'D' to toggle debug view</p>
    </div>
    
    <div id="canvasContainer"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
