<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Growth Simulation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            min-height: 100vh;
            overflow: hidden;
        }
        
        body {
            display: flex;
            align-items: center;
        }
        
        #canvasContainer {
            width: 100%;
            line-height: 0;
        }
        
        #canvasContainer canvas {
            width: 100%;
            height: 900px;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        
        button {
            margin-right: 10px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        #fpsCounter {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }

        .key-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
        }

        .key-hint p {
            margin: 0;
            line-height: 1.5;
        }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
</head>
<body>
    <div id="canvasContainer"></div>
    <div id="controls">
        <button id="startBtn">Start (S)</button>
        <button id="pauseBtn">Pause (P)</button>
        <button id="debugBtn">Debug (D)</button>
    </div>
    <div id="fpsCounter">FPS: 0</div>
    <div class="key-hint">
        <p>Press 'P' to pause/resume<br>Press 'D' to toggle debug view</p>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
    <script type="module" src="src/sketch.js"></script>
</body>
</html>
